<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selección de vuelos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
    <style>
        /* Botón redondo de cada día */
        .dia {
            width: 2.25rem;
            height: 2.25rem;
            padding: 0;
        }
        /* Los días del mes siguiente se ven en gris y no se pueden elegir */
        .fuera-mes {
            pointer-events: none;
        }
        /* Línea que separa los dos meses (solo cuando están lado a lado) */
        @media (min-width: 992px) {
            .mes-izquierdo {
                border-right: 1px solid var(--bs-border-color);
            }
        }
    </style>
</head>
<body>

<div class="container py-3">

    <!-- Dropdown: el botón abre/cierra el panel con los calendarios -->
    <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button"
                data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Selecciona la fecha
        </button>

        <div class="dropdown-menu w-100 p-0 border-0">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h4 class="card-title text-center mb-4">Fechas de Vuelos</h4>

                    <div class="row g-4">

                        <!-- Mes izquierdo -->
                        <div class="col-12 col-lg-6 mes-izquierdo">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <button type="button" class="btn btn-outline-secondary" aria-label="Mes anterior">
                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11.35 1.65a.5.5 0 0 1 0 .7L5.71 8l5.64 5.65a.5.5 0 0 1-.7.7l-6-6a.5.5 0 0 1 0-.7l6-6a.5.5 0 0 1 .7 0z"/></svg>
                                </button>
                                <span class="fw-bold">Septiembre 2025</span>
                            </div>
                            <table class="table table-borderless text-center mb-0">
                                <thead>
                                    <tr>
                                        <th>Lun</th><th>Mar</th><th>Mie</th><th>Jue</th><th>Vie</th><th>Sab</th><th>Dom</th>
                                    </tr>
                                </thead>
                                <tbody id="dias-septiembre"></tbody>
                            </table>
                        </div>

                        <!-- Mes derecho -->
                        <div class="col-12 col-lg-6">
                            <div class="d-flex align-items-center justify-content-end gap-3 mb-3">
                                <span class="fw-bold">Octubre 2025</span>
                                <button type="button" class="btn btn-outline-secondary" aria-label="Mes siguiente">
                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4.65 1.65a.5.5 0 0 1 .7 0l6 6a.5.5 0 0 1 0 .7l-6 6a.5.5 0 0 1-.7-.7L10.29 8 4.65 2.35a.5.5 0 0 1 0-.7z"/></svg>
                                </button>
                            </div>
                            <table class="table table-borderless text-center mb-0">
                                <thead>
                                    <tr>
                                        <th>Lun</th><th>Mar</th><th>Mie</th><th>Jue</th><th>Vie</th><th>Sab</th><th>Dom</th>
                                    </tr>
                                </thead>
                                <tbody id="dias-octubre"></tbody>
                            </table>
                        </div>

                    </div>

                    <!-- Botones de acción -->
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn btn-outline-secondary">Cancelar</button>
                        <button type="button" class="btn btn-outline-primary">Guardar</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // Arma las 5 semanas de un mes: 30 días del mes + 5 días del mes siguiente (en gris),
    // igual que en la imagen del ejercicio.
    function armarCalendario(idTbody) {
        const tbody = document.getElementById(idTbody);
        const dias = [];
        for (let d = 1; d <= 30; d++) dias.push({ numero: d, delMes: true });
        for (let d = 1; d <= 5; d++) dias.push({ numero: d, delMes: false });

        for (let semana = 0; semana < 5; semana++) {
            const fila = document.createElement('tr');
            for (let i = 0; i < 7; i++) {
                const dia = dias[semana * 7 + i];
                const celda = document.createElement('td');
                const boton = document.createElement('button');
                boton.type = 'button';
                boton.className = 'btn btn-outline-light rounded-circle dia ' + (dia.delMes ? 'text-dark' : 'text-muted fuera-mes');
                boton.textContent = dia.numero;
                celda.appendChild(boton);
                fila.appendChild(celda);
            }
            tbody.appendChild(fila);
        }
    }

    armarCalendario('dias-septiembre');
    armarCalendario('dias-octubre');

    // Al hacer clic en un día, queda marcado con btn-primary
    document.querySelectorAll('.dia:not(.fuera-mes)').forEach(boton => {
        boton.addEventListener('click', () => {
            document.querySelectorAll('.dia.btn-primary').forEach(b => {
                b.classList.replace('btn-primary', 'btn-outline-light');
                b.classList.add('text-dark');
            });
            boton.classList.replace('btn-outline-light', 'btn-primary');
            boton.classList.remove('text-dark');
        });
    });
</script>

</body>
</html>
