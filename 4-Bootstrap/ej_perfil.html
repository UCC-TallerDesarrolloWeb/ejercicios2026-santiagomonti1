<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
    <style>
        .perfil {
            max-width: 18rem;
        }
        .portada {
            height: 11rem;
            object-fit: cover;
        }
        /* La foto de perfil "sube" para quedar encima de la portada */
        .foto-perfil {
            width: 6.5rem;
            height: 6.5rem;
            margin-top: -4.5rem;
        }
        .icono {
            width: 1.1rem;
            height: 1.1rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="card perfil mx-auto shadow-sm">

        <!-- Portada -->
        <img class="card-img-top portada" src="imagenes/portada.svg" alt="Portada">

        <!-- Datos del perfil -->
        <div class="card-body text-center pt-0">
            <img class="foto-perfil rounded-circle border border-3 border-white bg-white" src="imagenes/avatar.svg" alt="Foto de perfil">
            <h5 class="card-title mt-2 mb-2">Santiago Monti</h5>
            <p class="card-text small">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. In pulvinar lacus risus,
                et convallis ante sodales eget. Nulla ornare dui non tellus varius tincidunt.
            </p>
            <a href="#" class="btn btn-primary btn-sm">Ver perfil</a>
        </div>

        <!-- Accesos -->
        <div class="list-group list-group-flush small">
            <a href="#" class="list-group-item list-group-item-action text-muted d-flex align-items-center gap-2">
                <svg class="icono" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="2" width="13" height="10" rx="1"/><path d="M4 12.5 3.5 15 7 12.5M4.5 5h7M4.5 7h7M4.5 9h4"/></svg>
                Ir a mensajes
            </a>
            <a href="#" class="list-group-item list-group-item-action text-muted d-flex align-items-center gap-2">
                <svg class="icono" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5c0 3.5-1.5 5-1.5 5h12s-1.5-1.5-1.5-5A4.5 4.5 0 0 0 8 1.5zM6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>
                Notificaciones
                <span class="badge bg-danger">+99</span>
            </a>
            <a href="#" class="list-group-item list-group-item-action bg-light text-dark d-flex align-items-center gap-2">
                <svg class="icono" viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="5" r="3"/><path d="M0.5 15c0-3.5 2.5-5.5 5.5-5.5s5.5 2 5.5 5.5z"/><circle cx="11.5" cy="5.5" r="2.2"/><path d="M12 9.5c2 .3 3.5 2 3.5 4.5h-3c0-1.8-.2-3.3-.5-4.5z"/></svg>
                Solicitudes Pendientes
            </a>
            <a href="#" class="list-group-item list-group-item-action text-muted d-flex align-items-center gap-2">
                <svg class="icono" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="4" width="10" height="8" rx="1"/><path d="M11 7l4-2.5v7L11 9"/></svg>
                Llamar
            </a>
        </div>

    </div>

</div>

</body>
</html>
