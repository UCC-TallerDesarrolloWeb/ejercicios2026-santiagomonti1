<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Timeline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
    <style>
        .avatar {
            width: 2rem;
            height: 2rem;
        }
        .timeline {
            min-width: 900px;
        }
    </style>
</head>
<body>

<div class="container-fluid py-3">
    <!-- overflow-auto: en pantallas chicas el timeline se desplaza horizontalmente en vez de romperse -->
    <div class="overflow-auto">
    <div class="border p-1 bg-white timeline">

        <!-- Encabezado: meses y semanas -->
        <div class="bg-black text-white text-center">
            <div class="row g-0 py-2 fw-bold">
                <div class="col-6">Enero</div>
                <div class="col-6">Febrero</div>
            </div>
            <div class="row g-0 border-top border-secondary">
                <div class="col">Semana 1</div>
                <div class="col border-start border-white">Semana 2</div>
                <div class="col border-start border-white">Semana 3</div>
                <div class="col border-start border-white">Semana 4</div>
                <div class="col border-start border-white">Semana 1</div>
                <div class="col border-start border-white">Semana 2</div>
                <div class="col border-start border-white">Semana 3</div>
                <div class="col border-start border-white">Semana 4</div>
            </div>
        </div>

        <!--
            Tareas: se usa la grilla de 12 columnas.
            8 semanas = 12 columnas -> cada semana equivale a 1,5 columnas.
            col-5 = duración de la tarea, offset-* = semana en que empieza.
        -->
        <div class="py-4 px-3">

            <div class="row mb-3">
                <div class="col-5">
                    <div class="bg-secondary text-white rounded p-2 d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-info small">Completed</div>
                            <div class="fw-bold">Define Arqchitecture</div>
                            <div class="text-white-50 small">20 Enero</div>
                        </div>
                        <div class="d-flex gap-1">
                            <img class="avatar rounded-circle border border-white" src="imagenes/avatar.svg" alt="Responsable">
                            <img class="avatar rounded-circle border border-white" src="imagenes/avatar.svg" alt="Responsable">
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-5 offset-3">
                    <div class="bg-secondary text-white rounded p-2 d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-warning small">In Progress</div>
                            <div class="fw-bold">Define Arqchitecture</div>
                            <div class="text-white-50 small">20 Enero</div>
                        </div>
                        <div class="d-flex gap-1">
                            <img class="avatar rounded-circle border border-white" src="imagenes/avatar.svg" alt="Responsable">
                            <img class="avatar rounded-circle border border-white" src="imagenes/avatar.svg" alt="Responsable">
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-5 offset-5">
                    <div class="bg-secondary text-white rounded p-2 d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-danger small">Blocked</div>
                            <div class="fw-bold">Define Arqchitecture</div>
                            <div class="text-white-50 small">20 Enero</div>
                        </div>
                        <div class="d-flex gap-1">
                            <img class="avatar rounded-circle border border-white" src="imagenes/avatar.svg" alt="Responsable">
                            <img class="avatar rounded-circle border border-white" src="imagenes/avatar.svg" alt="Responsable">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    </div>
</div>

</body>
</html>
